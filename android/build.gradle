buildscript {
    ext.kotlin_version = '1.9.24'
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    
    // МАГІЯ: Примусово піднімаємо версію SDK для всіх плагінів (вкл. workmanager), 
    // щоб вони бачили нові класи Android 14/15 і не видавали Unresolved reference.
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileSdk = 35
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
